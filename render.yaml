databases:
  - name: hifdhscroll-db
    plan: free
    databaseName: hifdhscroll
    user: hifdhscroll

services:
  - type: web
    name: hifdhscroll
    runtime: node
    plan: free
    region: oregon
    branch: claude/app-deployment-plan-g48tfj
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.9.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hifdhscroll-db
          property: connectionString
      - key: WAITLIST_COOKIE_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_DONATE_URL
        value: https://example.com/replace-with-your-real-donation-link
