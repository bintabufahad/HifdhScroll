services:
  - type: web
    name: hifdhscroll
    runtime: node
    plan: free
    region: oregon
    branch: claude/app-deployment-plan-g48tfj
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.9.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://replace-with-your-project-ref.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: replace-with-your-supabase-anon-key
      - key: NEXT_PUBLIC_DONATE_URL
        value: https://example.com/replace-with-your-real-donation-link
